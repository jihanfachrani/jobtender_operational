<!DOCTYPE html>
<html>

<head>

<title>Spesifikasi Job Tender</title>

<link rel="stylesheet" href="css/style.css">

<meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<body>

<header>

<img src="images/logo.png" class="logo">

<h1 id="judulTender">Job Tender Internal</h1>

<p>AirNav Indonesia</p>

<p><b>Periode :</b> <span id="periodeTender"></span></p>

<p><b>Batas Pendaftaran :</b> <span id="batasTender"></span></p>

</header>

<div class="container">

<h2>Daftar Jabatan yang Dibuka</h2>

<table>

<thead>

<tr>
<th>Jabatan</th>
<th>Lokasi</th>
<th>Level</th>
</tr>

</thead>

<tbody id="jabatanTable"></tbody>

</table>

<h2>Seleksi Administratif</h2>

<h3>Mandatory</h3>

<div id="mandatory" class="card-container"></div>

<h3>Ranking</h3>

<div id="ranking" class="card-container"></div>

<h2>Tahap Wawancara</h2>

<div id="wawancara" class="card-container"></div>

<h2>Jadwal Seleksi</h2>

<table>

<thead>

<tr>
<th>Tahap</th>
<th>Tanggal</th>
<th>Waktu</th>
</tr>

</thead>

<tbody id="jadwalTable"></tbody>

</table>

</div>

<script src="js/script.js"></script>

</body>

</html>
